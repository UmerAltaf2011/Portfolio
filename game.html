<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPS | Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0a0a23, #14143a, #0a0a23);
      background-size: 200% 200%;
      animation: animatedGradient 10s ease infinite;
    }

    @keyframes animatedGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .neon-text {
     cursor: pointer;
      background: linear-gradient(90deg, #8662ca, #736dca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      user-select: none;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(129, 230, 217, 0.08);
    }
    .choice-animate {
  animation: pop 0.3s ease;
}

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.result-animate {
  animation: flash 0.4s ease-in-out;
}

@keyframes flash {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.8; }
  100% { transform: scale(1); opacity: 1; }
}

  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 text-white">

  <div class="glass max-w-lg w-full p-6 rounded-2xl text-center shadow-2xl border border-cyan-400/10">
    <h1 class="text-3xl font-bold mb-4 neon-text">Rock Paper Scissors</h1>
    <p class="mb-6 text-sm text-gray-300">Challenge the computer. Will you win or glitch?</p>

    <div class="flex justify-center gap-4 mb-6 flex-wrap">
      <button onclick="play('rock')" class="px-6 py-2 rounded-full bg-cyan-900/30 border border-cyan-400 text-cyan-200 hover:bg-cyan-400/20 hover:scale-105 transition-all">✊ Rock</button>
      <button onclick="play('paper')" class="px-6 py-2 rounded-full bg-cyan-900/30 border border-cyan-400 text-cyan-200 hover:bg-cyan-400/20 hover:scale-105 transition-all">✋ Paper</button>
      <button onclick="play('scissors')" class="px-6 py-2 rounded-full bg-cyan-900/30 border border-cyan-400 text-cyan-200 hover:bg-cyan-400/20 hover:scale-105 transition-all">✌️ Scissors</button>
    </div>

    <div class="text-md space-y-2 text-gray-300">
      <p id="player-choice">You chose: <span class="font-semibold text-white">-</span></p>
      <p id="computer-choice">Computer chose: <span class="font-semibold text-white">-</span></p>
      <p id="result" class="text-lg font-bold mt-3 text-pink-300">Result: -</p>
    </div>
  </div>

<script>
  const choices = ['rock', 'paper', 'scissors'];
  let previousComputerMove = null;

  function getUnpredictableMove() {
    // Filter out the last move to reduce repetition
    const filtered = choices.filter(choice => choice !== previousComputerMove);
    const move = filtered[Math.floor(Math.random() * filtered.length)];
    previousComputerMove = move;
    return move;
  }

  function play(playerMove) {
    const buttons = document.querySelectorAll("button");
    buttons.forEach(btn => btn.classList.remove("choice-animate"));

    const clickedButton = [...buttons].find(btn => btn.textContent.toLowerCase().includes(playerMove));
    clickedButton.classList.add("choice-animate");

    document.getElementById("computer-choice").querySelector("span").textContent = "...";
    document.getElementById("result").textContent = "Result: ...";

    setTimeout(() => {
      const computerMove = getUnpredictableMove(); // now using smart randomness!

      document.getElementById("player-choice").querySelector("span").textContent = playerMove;
      document.getElementById("computer-choice").querySelector("span").textContent = computerMove;

      let result = "";
      if (playerMove === computerMove) {
        result = "It's a draw 🌀";
      } else if (
        (playerMove === 'rock' && computerMove === 'scissors') ||
        (playerMove === 'paper' && computerMove === 'rock') ||
        (playerMove === 'scissors' && computerMove === 'paper')
      ) {
        result = "You win! 🔥";
      } else {
        result = "You lose! 💀";
      }

      const resultEl = document.getElementById("result");
      resultEl.textContent = "Result: " + result;
      resultEl.classList.remove("result-animate");
      void resultEl.offsetWidth;
      resultEl.classList.add("result-animate");
    }, 500);
  }
</script>



</body>
</html>
